<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI4Image - Image Extraction</title>
    <link rel="stylesheet" href="../static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: flex-start;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
        }
        .image-wrapper {
            position: relative;
            display: inline-block;
        }
        .image-wrapper img {
            display: block; /* Remove any default inline spacing */
            max-width: 100%;
            height: auto;
        }
        
        #feedback-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; /* Match the image's width */
            height: 100%; /* Match the image's height */
            border: 1px solid red;
        }
        .fact-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fact-text {
            color: #fff;
            font-size: 1.5rem;
            text-align: center;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.9);
            border-radius: 10px;
            max-width: 80%;
            opacity: 0;
            transform: translateY(20px);
            animation: slideIn 0.5s forwards, glow 2s infinite alternate;
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes glow {
            0% { box-shadow: 0 0 5px #3498db; }
            100% { box-shadow: 0 0 20px #3498db; }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <nav class="navbar">
        <a href="/" class="logo">AI4Image</a>
        <div class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="/generator">Image Generator</a></li>

            <li><a href="/creator">Creator</a></li>

        <button id="theme-toggle" class="glow-btn">Toggle Theme</button>

    <div class="container futuristic-container">
        <h1 class="neon-text">Image Extraction</h1>
        <div class="input-section">
            <input type="file" id="imageInput" accept="image/*" class="glow-input">
            <button onclick="detectObjects()" class="glow-btn">Detect Objects</button>
        </div>

        <div id="extractedImage" class="extracted-container"></div>
        <div id="feedback-instructions" style="display: none; margin-top: 1rem; color: var(--text-color); text-align: center;">
            Click on the full image to refine segmentation (left click to include, right click to exclude). Press 'Enter' to submit feedback.
        </div>
        <div id="editControls" class="edit-controls" style="display: none;"></div>
        <div id="animationResult" class="animation-container" style="display: none;"></div>

    <script src="../static/script.js"></script>
    <script>
        // Define fileToBase64 at the top to ensure availability
        function fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        }
    
        let originalExtractedImage = null;
        let texts = [];
        let currentLabel = null;
        let fullImageBox = null;
        let fullImageWidth = 0;
        let fullImageHeight = 0;
        let editControlsVisible = false;
        let fullImageData = null;
        let points = [];
        let labels = [];
    
        async function detectObjects() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return alert('Please upload an image.');
    
            const formData = new FormData();
            formData.append('image', file);
    
            const response = await fetch('/detect', {
                method: 'POST',
                body: formData
            });
            const detections = await response.json();
    
            const resultsDiv = document.getElementById('detectionResults');
            resultsDiv.innerHTML = '';
            detections.forEach((det, index) => {
                const btn = document.createElement('button');
                btn.textContent = `Extract ${det.label} (${(det.score * 100).toFixed(2)}%)`;
                btn.className = 'glow-btn';
                btn.style.margin = '0.5rem';
                btn.onclick = () => extractObject(file, det.box, det.label);
                resultsDiv.appendChild(btn);
            });
        }
    
        async function extractObject(file, box, label) {
            const img = await fileToBase64(file);
    
            // Create fact overlay
            const overlay = document.createElement('div');
            overlay.className = 'fact-overlay';
            const loader = document.createElement('div');
            loader.className = 'loader';
            const factText = document.createElement('div');
            factText.className = 'fact-text';
            factText.textContent = "Extracting your image...";
            overlay.appendChild(loader);
            overlay.appendChild(factText);
            document.body.appendChild(overlay);
    
            // Fade in overlay

                overlay.style.opacity = '1';
                console.log("Overlay faded in");

            try {
                // Define temporary facts first

                    "In 2021, AI was used to discover new exoplanets in telescope data.",
                    "AI-powered systems can monitor ocean health using underwater sensors.",
                    "Machine Learning can predict the impact of climate change on ecosystems.",
                    "AI is used in the food industry to develop new recipes.",
                    "The first AI to play chess at a superhuman level was Deep Blue in 1997.",
                    "AI can generate realistic simulations for training autonomous vehicles.",
                    "Machine Learning is used in marketing to segment customers for campaigns.",
                    "AI can analyze historical data to predict future economic trends.",
                    "In 2022, AI was used to create a new language model for low-resource languages.",
                    "AI-powered systems can assist in disaster response by analyzing real-time data."
                ];
    
                // Start displaying facts immediately
                let factInterval;
                let facts = [...tempFacts]; // Start with temp facts
                let factIndex = 0;
    
                console.log("Starting fact display loop with temp facts:", facts);
                factInterval = setInterval(() => {
                    console.log("Fact interval tick, current facts:", facts);
                    factText.style.animation = 'none'; // Reset animation
                    void factText.offsetWidth; // Trigger reflow to restart animation
                    factText.style.animation = 'slideIn 0.5s forwards, glow 2s infinite alternate';
                    
                    factText.textContent = facts[factIndex];
                    console.log("Displaying fact:", facts[factIndex]);
                    factIndex = (factIndex + 1) % facts.length;
                }, 4000); // Change fact every 4 seconds
    
                // Start the fetch request with a timeout
                const fetchPromise = Promise.race([
                    fetch('/extract', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: img.split(',')[1], box })
                    }),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Fetch timeout')), 1200000)) // 30-second timeout
                ]);
    
                // Wait for the response
                console.log("Waiting for fetch response...");
                const response = await fetchPromise;
                console.log("Fetch response received:", response);
                const result = await response.json();
                console.log("Parsed response:", result);
    
                // Update facts with the ones from the backend
                console.log("Facts received:", result.facts);
                if (result.facts && result.facts.length > 0) {
                    facts.length = 0; // Clear the current facts
                    facts.push(...result.facts); // Update with backend facts
                    factIndex = 0; // Reset index to start from the first fact
                    console.log("Updated facts to backend facts:", facts);
    
                    // Immediately display the first backend fact
                    factText.style.animation = 'none'; // Reset animation
                    void factText.offsetWidth; // Trigger reflow to restart animation
                    factText.style.animation = 'slideIn 0.5s forwards, glow 2s infinite alternate';
                    factText.textContent = facts[factIndex];
                    console.log("Immediately displaying first backend fact:", facts[factIndex]);
                    factIndex = (factIndex + 1) % facts.length;
                } else {
                    console.log("No facts received from backend, continuing with temp facts.");
                    facts.length = 0;
                    facts.push(...tempFacts); // Fallback to temp facts
                }
    
                // Add a short delay to ensure at least one backend fact is displayed
                await new Promise(resolve => setTimeout(resolve, 2000)); // Wait 2 seconds
    
                // Clear the interval and remove overlay
                console.log("Clearing fact interval and removing overlay");
                clearInterval(factInterval);
                overlay.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(overlay);
                    console.log("Overlay removed");
                }, 500);
    
                if (result.error) {
                    alert(result.error);
                    return;
                }
    
                originalExtractedImage = result.image;
                fullImageData = result.full_image;
                fullImageBox = result.box;
                fullImageWidth = result.full_width;
                fullImageHeight = result.full_height;
    
                const extractedDiv = document.getElementById('extractedImage');
                extractedDiv.innerHTML = `
                    <div class="image-container">
                        <div>
                            <h3>Original Image</h3>
                            <div class="image-wrapper">
                                <img id="fullImg" src="data:image/png;base64,${result.full_image}" alt="Full Image" draggable="false">
                                <canvas id="feedback-canvas"></canvas>
                            </div>
                        </div>
                        <div>
                            <h3>Extracted Object</h3>
                            <img id="extractedImg" src="data:image/png;base64,${result.image}" alt="Extracted Object" draggable="false">
                        </div>
                    </div>
                    <button class="glow-btn" onclick="showEditControls()">Edit Image</button>
                    <button class="glow-btn" onclick="downloadImage()">Download Image</button>
                `;
                document.getElementById('editControls').style.display = 'none';
                editControlsVisible = false;
                setupFeedbackCanvas();
    
                console.log("Extracted image assigned:", originalExtractedImage.substring(0, 50));
            } catch (error) {
                console.error("Extraction failed:", error);
                factText.textContent = "An error occurred during extraction: " + error.message;
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        document.body.removeChild(overlay);
                        console.log("Overlay removed due to error");
                    }, 500);
                }, 2000);
            }
        }
    
        function setupFeedbackCanvas() {
            const feedbackCanvas = document.getElementById('feedback-canvas');
            const fullImg = document.getElementById('fullImg');
            const feedbackInstructions = document.getElementById('feedback-instructions');
            const ctx = feedbackCanvas.getContext('2d');
        
            fullImg.onload = function() {
                const displayedWidth = fullImg.clientWidth;
                const displayedHeight = fullImg.clientHeight;
        
                feedbackCanvas.width = displayedWidth;
                feedbackCanvas.height = displayedHeight;
                feedbackCanvas.style.width = `${displayedWidth}px`;
                feedbackCanvas.style.height = `${displayedHeight}px`;
                feedbackCanvas.style.top = '30px'; // Consistent offset
                feedbackCanvas.style.left = '0px';
                feedbackCanvas.style.zIndex = '100';
                feedbackCanvas.style.pointerEvents = 'auto';
        
                feedbackInstructions.style.display = 'block';
            };
        
            if (fullImg.complete) fullImg.onload();
        
            feedbackCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
            fullImg.addEventListener('contextmenu', (e) => e.preventDefault());
        
            feedbackCanvas.addEventListener('mousedown', function(event) {
                event.preventDefault();
                const rect = feedbackCanvas.getBoundingClientRect();
                const displayX = event.clientX - rect.left;
                const displayY = event.clientY - rect.top;
        
                if (displayX < 0 || displayX > feedbackCanvas.width || displayY < 0 || displayY > feedbackCanvas.height) {
                    console.log("Click outside canvas boundaries, ignoring:", displayX, displayY);
                    return;
                }
        
                const scaleX = fullImageWidth / feedbackCanvas.width;
                const scaleY = fullImageHeight / feedbackCanvas.height;
                const fullX = displayX * scaleX;
                const fullY = displayY * scaleY;
        
                const label = event.button === 2 ? 0 : 1; // Right click = 0 (exclude), Left click = 1 (include)
        
                let addPoint = true;
                for (let i = 0; i < points.length; i++) {
                    const [px, py] = points[i];
                    const distance = Math.sqrt((px - fullX) ** 2 + (py - fullY) ** 2);
                    if (distance < 10) {
                        addPoint = false;
                        break;
                    }
                }
        
                if (addPoint) {
                    points.push([fullX, fullY]);
                    labels.push(label);
        
                    ctx.beginPath();
                    ctx.arc(displayX, displayY, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = label === 1 ? 'green' : 'red';
                    ctx.fill();
                    ctx.closePath();
        
                    console.log(`Point added: x=${fullX}, y=${fullY}, label=${label}`);
                }
            });
        
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' && points.length > 0) {
                    fetch('/refine', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            image: fullImageData,
                            extractedImage: originalExtractedImage,
                            points: points,
                            labels: labels,
                            box: fullImageBox
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.image) {
                            originalExtractedImage = data.image;
                            document.getElementById('extractedImg').src = 'data:image/png;base64,' + data.image;
                            points = [];
                            labels = [];
                            ctx.clearRect(0, 0, feedbackCanvas.width, feedbackCanvas.height);
                            if (editControlsVisible) updateImage();
                        } else if (data.error) alert('Failed to refine segmentation: ' + data.error);
                    })
                    .catch(error => alert('Failed to refine segmentation: ' + error.message));
                }
            });
        
            window.addEventListener('resize', () => {
                const displayedWidth = fullImg.clientWidth;
                const displayedHeight = fullImg.clientHeight;
        
                feedbackCanvas.width = displayedWidth;
                feedbackCanvas.height = displayedHeight;
                feedbackCanvas.style.width = `${displayedWidth}px`;
                feedbackCanvas.style.height = `${displayedHeight}px`;
                points = [];
                labels = [];
                ctx.clearRect(0, 0, feedbackCanvas.width, feedbackCanvas.height);
            });
        }

        function showEditControls() {
            const editControls = document.getElementById('editControls');
            editControls.style.display = 'block';
            editControlsVisible = true;
            editControls.innerHTML = `
                <div class="control-group">
                    <label>Brightness:</label>
                    <input type="range" id="brightness" min="0" max="200" value="100" class="color-slider">
                </div>
                <div class="control-group">
                    <label>Contrast:</label>
                    <input type="range" id="contrast" min="0" max="200" value="100" class="color-slider">
                </div>
                <div class="control-group">
                    <label>Saturation:</label>
                    <input type="range" id="saturation" min="0" max="200" value="100" class="color-slider">
                </div>
                <div class="control-group">
                    <label>Blur:</label>
                    <input type="range" id="blur" min="0" max="10" value="0" class="color-slider">
                </div>
                <div class="control-group">
                    <label>Rotation:</label>
                    <input type="range" id="rotation" min="0" max="360" value="0" class="color-slider">
                </div>
                <div class="control-group">
                    <label>Flip Horizontal:</label>
                    <label class="switch compact">
                        <input type="checkbox" id="flipH">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="control-group">
                    <label>Flip Vertical:</label>
                    <label class="switch compact">
                        <input type="checkbox" id="flipV">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="control-group">
                    <label>Text Color:</label>
                    <input type="color" id="textColor" value="#ffffff">
                </div>
                <div class="control-group">
                    <input type="text" id="textInput" placeholder="Enter text" class="glow-input">
                    <button class="glow-btn" onclick="addText()">Add Text</button>
                </div>
            `;
    
            ['brightness', 'contrast', 'saturation', 'blur', 'rotation', 'flipH', 'flipV'].forEach(id => {
                const element = document.getElementById(id);
                if (element.type === 'range') {
                    element.addEventListener('input', updateImage);
                } else if (element.type === 'checkbox') {
                    element.addEventListener('change', updateImage);
                }
            });
            document.getElementById('textColor').addEventListener('input', updateImage);
        }
    
        function addText() {
            const textInput = document.getElementById('textInput').value.trim();
            if (!textInput) return alert('Please enter some text.');
    
            const div = document.createElement('div');
            div.className = 'draggable-text';
            div.textContent = textInput;
            div.style.left = '50px';
            div.style.top = '50px';
            div.setAttribute('data-x', 50);
            div.setAttribute('data-y', 50);
            div.setAttribute('data-color', document.getElementById('textColor').value);
    
            div.addEventListener('mousedown', startDragging);
            document.getElementById('extractedImage').appendChild(div);
            texts.push(div);
    
            document.getElementById('textInput').value = '';
            updateImage();
        }
    
        let draggedElement = null;
        let initialX, initialY;
    
        function startDragging(e) {
            draggedElement = e.target;
            initialX = e.clientX - parseInt(draggedElement.getAttribute('data-x'));
            initialY = e.clientY - parseInt(draggedElement.getAttribute('data-y'));
    
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDragging);
        }
    
        function drag(e) {
            if (draggedElement) {
                const x = e.clientX - initialX;
                const y = e.clientY - initialY;
                draggedElement.style.left = `${x}px`;
                draggedElement.style.top = `${y}px`;
                draggedElement.setAttribute('data-x', x);
                draggedElement.setAttribute('data-y', y);
                updateImage();
            }
        }
    
        function stopDragging() {
            if (draggedElement) {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('mouseup', stopDragging);
                draggedElement = null;
            }
        }
    
        function updateImage() {
            if (!editControlsVisible) return;
    
            const brightness = document.getElementById('brightness')?.value || 100;
            const contrast = document.getElementById('contrast')?.value || 100;
            const saturation = document.getElementById('saturation')?.value || 100;
            const blur = document.getElementById('blur')?.value || 0;
            const rotation = document.getElementById('rotation')?.value || 0;
            const flipH = document.getElementById('flipH')?.checked || false;
            const flipV = document.getElementById('flipV')?.checked || false;
            const textColor = document.getElementById('textColor')?.value || '#ffffff';
    
            const img = new Image();
            img.src = `data:image/png;base64,${originalExtractedImage}`;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
    
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) blur(${blur}px)`;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
    
                ctx.translate(canvas.width / 2, canvas.height / 2);
                if (flipH) ctx.scale(-1, 1);
                if (flipV) ctx.scale(1, -1);
                ctx.rotate((rotation * Math.PI) / 180);
                ctx.translate(-canvas.width / 2, -canvas.height / 2);
    
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                texts.forEach(text => {

    <script>
document.addEventListener('DOMContentLoaded', function() {
    const feedbackCanvas = document.getElementById('feedback-canvas');
    const ctx = feedbackCanvas.getContext('2d');
    let points = [];
    let labels = []; // 1 for include (green), 0 for exclude (red)

    feedbackCanvas.addEventListener('mousedown', function(event) {
        const rect = feedbackCanvas.getBoundingClientRect();
        const displayX = event.clientX - rect.left;
        const displayY = event.clientY - rect.top;

        if (displayX < 0 || displayY < 0 || displayX > feedbackCanvas.width || displayY > feedbackCanvas.height) {
            console.log("Click outside canvas boundaries, ignoring:", displayX, displayY);
            return;
        }

        const scaleX = fullImageWidth / feedbackCanvas.width;
        const scaleY = fullImageHeight / feedbackCanvas.height;
        const fullX = displayX * scaleX;
        const fullY = displayY * scaleY;

        const label = event.button === 2 ? 0 : 1; // Left click = 1 (include), Right click = 0 (exclude)

        let addPoint = true;
        for (let i = 0; i < points.length; i++) {
            const [px, py] = points[i];
            const distance = Math.sqrt((px - fullX) ** 2 + (py - fullY) ** 2);
            if (distance < 10) {
                addPoint = false;
                break;
            }
        }

        if (addPoint) {
            points.push([fullX, fullY]);
            labels.push(label);

            ctx.beginPath();
            ctx.arc(displayX, displayY, 5, 0, 2 * Math.PI);
            ctx.fillStyle = label === 1 ? 'green' : 'red'; // Green for include, Red for exclude
            ctx.fill();
            ctx.closePath();

            console.log(`Full-image click: x=${fullX}, y=${fullY}, label=${label}`);
        }
    });

    // Prevent context menu on right-click
    feedbackCanvas.addEventListener('contextmenu', function(event) {
        event.preventDefault();
    });
});
</script>
